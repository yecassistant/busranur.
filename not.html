<head>

<title>Büşranur'un Resmi</title>
<meta name="description" content="Büşranur, resmin hazır! Görmek için tıkla.">

<body data-page="not" data-tone="peo">
<div class="progress" data-step="6" data-total="6"></div>
<main class="stage">
  <div class="bouquet"></div>
  <h2>Bana söylemek istediğin <em>bir şey</em> var mı?</h2>
  <p class="lead">Mesela: "çiçek getir", "geç kalma", "tatlı da isterim"…</p>
  <label for="note" class="small">Notun (isteğe bağlı)</label>
  <textarea id="note" placeholder="Buraya yaz…"></textarea>
  <div class="btns">
    <button class="btn lav" id="next">Devam et</button>
    <button class="btn ghost" id="skip">Not yok, geç</button>
  </div>
</main>
<script src="app.js"></script>
</body>
