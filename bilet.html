<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Büşranur'un Resmi</title>
<meta name="description" content="Büşranur, resmin hazır! Görmek için tıkla.">
<meta property="og:title" content="Büşranur, resmin hazır!">
<meta property="og:description" content="Sadece Büşranur için çizildi. Görmek için tıkla.">
<meta name="theme-color" content="#ec6f9a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Nunito:wght@600;700;800&family=Caveat:wght@600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="bilet" data-tone="lav">

<main class="stage">
  <div class="eyebrow">anlaştık o zaman</div>
  <h2>İşte resmin, <em>Büşranur</em></h2>
  <div class="frame" id="frame"><img src="resim.jpg" alt="Senin için çizilen resim"></div>
  <div class="ticket">
    <h3>Büşranur'un Randevu Bileti</h3>
    <div class="row"><span>Davetli</span><span>Büşranur</span></div>
    <div class="row"><span>Buluşma</span><span id="tKind"></span></div>
    <div class="row"><span>Menü</span><span id="tMenu"></span></div>
    <div class="row"><span>Gün</span><span id="tDay"></span></div>
    <div class="row"><span>Saat</span><span id="tTime"></span></div>
    <div class="row" id="tNoteRow"><span>Not</span><span id="tNote"></span></div>
    <div class="row"><span>Teslimat</span><span>Resmin aslı, elden</span></div>
  </div>
  <p class="sign">Görüşmek üzere</p>
  <div class="btns" id="bilet-btns">
    <a class="btn green" id="wa" target="_blank" rel="noopener">WhatsApp'tan gönder</a>
    <button class="btn ghost" id="copy">Metni kopyala</button>
  </div>
  <p class="small" id="copyMsg">Butona basınca bilet WhatsApp'tan bana gelir.</p>
  <div class="btns"><button class="btn link" id="again">Planı değiştir</button></div>
</main>
<script src="app.js"></script>
</body>
</html>
