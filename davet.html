<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Büşranur'un Resmi</title>
<meta name="description" content="Büşranur, resmin hazır! Görmek için tıkla.">
<meta property="og:title" content="Büşranur, resmin hazır!">
<meta property="og:description" content="Sadece Büşranur için çizildi. Görmek için tıkla.">
<meta name="theme-color" content="#ec6f9a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Nunito:wght@600;700;800&family=Caveat:wght@600;700&display=swap">
<link rel="stylesheet" href="style.css">

<body data-page="davet" data-tone="peo">
<div class="progress" data-step="1" data-total="6"></div>
<main class="stage">
  <div class="bouquet"></div>
  <div class="eyebrow">ama bir dakika Büşranur…</div>
  <h2>Bu resim <em>elden</em> teslim edilir</h2>
  <p class="lead">Postayla gönderilemeyecek kadar kıymetli. Teslimat ücreti küçük bir buluşma: benimle bir şeyler içer misin, ya da bir şeyler yer miyiz?</p>
  <div class="frame small"><img src="resim.jpg" alt=""><div class="seal" style="width:74px;height:74px;font-size:1.05rem">teslimat<br>bekliyor</div></div>
  <h2 style="font-size:1.6rem">Benimle buluşur musun, Büşranur?</h2>
  <div class="btns">
    <button class="btn pink" id="yes">Evet, buluşalım</button>
    <button class="btn ghost parked" id="no">Hayır</button>
  </div>
  <p class="hint" id="hint"></p>
</main>
<script src="app.js"></script>
</body>
</html>
