<head>
<meta charset="UTF-8">

<title>Büşranur'un Resmi</title>
<meta name="description" content="Resmin hazır! Görmek için tıkla.">
<meta property="og:title" content="Büşranur, resmin hazır!">
<meta property="og:description" content="Sadece senin için çizildi. Görmek için tıkla.">
<meta name="color-scheme" content="light">
<meta property="og:type" content="website">
<meta property="og:image" content="https://yecassistant.github.io/busranur/onizleme.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#ec6f9a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Nunito:wght@600;700;800&family=Caveat:wght@600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="saat" data-tone="lil">
<div class="progress" data-step="5" data-total="6"></div>
<main class="stage">
  <div class="bouquet"></div>
  <h2>Saat <em>kaçta</em>?</h2>
  <p class="lead">Ben her saate hazırım, sen söyle. Beylikdüzü'nden Ümraniye'ye yol uzun ama erken çıkarım, geç kalmam 😅</p>
  <div class="opts" id="opts"></div>
  <button type="button" class="opt" id="customToggle"><span class="ico" style="background:#e3f1ee">⏰</span><span><b>Başka bir saat</b><small>Sen söyle, ben ayarlarım</small></span></button>
  <div class="customBox" id="customBox" hidden>
    <label for="customTime" class="small" style="width:100%">Kutuya dokun, saati seç</label>
    <input type="time" id="customTime" step="300" required>
    <button type="button" class="btn lav" id="customGo">Bu saat olsun</button>
    <p class="hint" id="customHint"></p>
  </div>
  <div class="btns"><button type="button" class="btn link" data-back="gun.html">Geri dön</button></div>
</main>
<script src="app.js"></script>
</body>
</html>
