<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Büşranur'un Resmi</title>
<meta name="description" content="Büşranur, resmin hazır! Görmek için tıkla.">

<body data-page="hazir" data-tone="lav">

<main class="stage">

  <h1>Resmin <em>hazır</em>!</h1>

  <div class="frame" id="frame" role="button" tabindex="0" aria-label="Resmi aç">
    <img src="resim.jpg" alt="Senin için çizilen resim">
